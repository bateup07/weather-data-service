spring:
  application:
    name: weather-data-service

  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:weather;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

weather:
  upstream:
    base-url: ${WEATHER_API_BASE_URL:https://api.open-meteo.com}
    connect-timeout-ms: ${WEATHER_CONNECT_TIMEOUT_MS:500}
    response-timeout-ms: ${WEATHER_RESPONSE_TIMEOUT_MS:1500}

  geocoding:
    base-url: ${GEOCODING_API_BASE_URL:https://geocoding-api.open-meteo.com}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      weather:
        baseConfig: default

  ratelimiter:
    configs:
      default:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 0s
    instances:
      weather:
        baseConfig: default

  retry:
    configs:
      default:
        maxAttempts: 2
        waitDuration: 200ms
        retryExceptions:
          - com.example.weather.exception.UpstreamWeatherException
    instances:
      weather:
        baseConfig: default
